name: NYC Taxi Pipeline CI/CD 
on: 
  push: 
    branches: 
      - main 
  workflow_dispatch: 
  schedule:
    - cron: '0 11 * * 0' 

jobs: 
  build-and-test: 
    runs-on: ubuntu-latest 
    env: 
      RAW_DATA: testing/sample/yellow_tripdata_2019.csv 

    steps:
      - name: Checkout code 
        uses: actions/checkout@v4 

      - name: Set up Python 
        uses: actions/setup-python@v5 
        with: 
          python-version: "3.11" 
      
      - name: Install uv 
        uses: astral-sh/setup-uv@v6
      
      - name: Install dependencies 
        run: | 
          uv sync 

      - name: Debug environment
        run: |
          echo "RAW_DATA=$RAW_DATA"
          ls -la
          ls -la testing/sample/
      
      - name: Testing Data Quality 
        run: | 
          uv run pytest 
      
      - name: Run ETL Pipeline 
        run: | 
          echo "Running ETL Pipeline..." 
          uv run python pipeline.py

  build-and-deploy: 
    needs: build-and-test 
    runs-on: ubuntu-latest 
    if: github.ref == 'refs/heads/main' 
    
    steps: 
      - name: Checkout code 
        uses: actions/checkout@v4 
      
      - name: Set up Python 
        uses: actions/setup-python@v5 
        with: 
          python-version: "3.11" 
      
      - name: Install uv 
        uses: astral-sh/setup-uv@v6
      
      - name: Install dependencies 
        run: | 
          uv sync
      
      - name: Deploy 
        run: | 
          echo "Deploying NYC Taxi Pipeline..."